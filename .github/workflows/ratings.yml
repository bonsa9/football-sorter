name: Compute Community Ratings

on:
  schedule:
    - cron: '0 3 * * *' # Runs nightly at 03:00 UTC
  workflow_dispatch: # Allows manual trigger from Actions tab

permissions:
  contents: write

jobs:
  compute-ratings:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Compute Bradley-Terry community ratings
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_READ_KEY: ${{ secrets.SUPABASE_READ_KEY || secrets.SUPABASE_ANON_KEY }}
        run: node --experimental-strip-types scripts/compute-ratings.ts

      - name: Commit and push updated ratings
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/ratings/*.json
          if git diff --staged --quiet; then
            echo "No rating changes to commit."
          else
            git commit -m "chore(ratings): update community Bradley-Terry ratings [skip ci]"
            git push origin main
          fi
